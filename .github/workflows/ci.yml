# Calls the shared gates in educlopez/github-actions-workflows.
# Update the workflow there and every repo picks it up on the next run.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]


jobs:
  lint:
    uses: educlopez/github-actions-workflows/.github/workflows/lint.yaml@v1
    with:
      package-manager: pnpm
      node-version: '24'
      install-command: 'pnpm install --frozen-lockfile && pnpm exec tsx scripts/generate-component-dates.ts'

  typecheck:
    uses: educlopez/github-actions-workflows/.github/workflows/typecheck.yaml@v1
    with:
      package-manager: pnpm
      node-version: '24'
      install-command: 'pnpm install --frozen-lockfile && pnpm exec tsx scripts/generate-component-dates.ts'

  tests:
    uses: educlopez/github-actions-workflows/.github/workflows/tests.yaml@v1
    with:
      package-manager: pnpm
      node-version: '24'
      test-command: 'pnpm test:run'
      install-command: 'pnpm install --frozen-lockfile && pnpm exec tsx scripts/generate-component-dates.ts'
