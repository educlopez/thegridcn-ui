# Calls the shared gates in educlopez/github-actions-workflows.
# Update the workflow there and every repo picks it up on the next run.

name: Secret Scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  secret-scan:
    uses: educlopez/github-actions-workflows/.github/workflows/secret-scan.yaml@v1
