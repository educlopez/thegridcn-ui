packages:
  - .

allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - esbuild
  - sharp
  - msw
  - unrs-resolver
  - "@tailwindcss/oxide"

overrides:
  minimatch: ">=3.1.3"
  flatted: ">=3.3.4"
  ajv: "^8.17.1"
  "@eslint/eslintrc>ajv": "^6.12.6"
  "eslint>ajv": "^6.12.6"
  "@isaacs/brace-expansion": ">=2.0.0"
  qs: "^6.16.1"
  # Pin each vulnerable major so overrides do not jump to a new API.
  "brace-expansion@5": "^5.0.12"
  "nanoid@3": "^3.3.18"
  "js-yaml@4": "^4.3.2"
  "fast-uri@3": "^3.1.8"
  "@babel/core": "^7.29.7"
  postcss: "^8.5.23"
  sharp: "^0.35.5"
  hono: "^4.13.11"
  "@hono/node-server@1": "^1.19.15"
  ip-address: "^10.7.1"
  body-parser: "^2.3.0"
  esbuild: "^0.28.1"
  proxy-addr: "^2.0.8"
  browserslist: "^4.28.7"
  source-map-js: "^1.2.2"
  "undici@7": "^7.29.1"
  "vite@7": "^7.3.7"
  baseline-browser-mapping: "^2.11.0"
  "fflate@0.6": "^0.6.11"
  postcss-selector-parser: "^7.1.6"
  "@modelcontextprotocol/sdk": "^1.32.1"

# SECURITY: supply-chain hardening (npm-security-best-practices)
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - "@educlopez/*"
blockExoticSubdeps: true
